<!doctype html>
<html lang="nn">
  <head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><title>Kontaktskjema — Helle AS</title></head>
  <body>
    <!-- Static declaration for Netlify Forms. Keep names in sync with ContactForm. -->
    <form name="kontakt" method="POST" action="/takk.html" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input name="form-name" value="kontakt" type="hidden">
      <input name="subject" value="Ny førespurnad frå helleas.no" type="hidden">
      <input name="bot-field">
      <input name="name">
      <input name="email" type="email">
      <input name="phone" type="tel">
      <textarea name="message"></textarea>
    </form>
    <a href="/#contact">Til kontaktskjemaet</a>
  </body>
</html>
